services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dogfood
      POSTGRES_PASSWORD: dogfood
      POSTGRES_DB: dogfood
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dogfood -d dogfood"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: "server -dir=/data -volume.max=5 -s3 -filer"
    ports: ["8333:8333", "8888:8888", "9333:9333", "19333:19333"]
    volumes: [seaweeddata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@postgres:5432/dogfood
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: dogfood
      S3_SECRET_KEY: dogfoodlocal
      S3_BUCKET: dogfood-assets
      S3_REGION: us-east-1
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      OFFLINE_MODE: "true"
      NODE_ENV: production
      PORT: "3000"
      APP_URL: http://localhost:3000
      SESSION_SECRET: docker-container-super-secret-key-32chars
      SIGNING_KEY_PATH: /data/keys/ed25519.pem
      # Must match webhook-worker's values below — see that service's
      # comment (registration here, delivery there, independent processes).
      WEBHOOK_ALLOWED_HOSTS: ""
      WEBHOOK_ALLOW_PRIVATE_HOSTS: "false"
    ports: ["3000:3000"]
    volumes: [keys:/data/keys]

  # One-shot boot tasks: `docker compose up` alone migrates (app entrypoint),
  # seeds, and proves the CLI — no extra commands needed. The test suite is
  # NOT run on boot; it is ready to run with zero setup (see `cli` service).
  seed:
    build: .
    # Migrate first: on a fresh volume no tables exist yet, and the app waits
    # on this service, so the app entrypoint migration alone would never run.
    # Fixtures load second-to-last and skip when the sample event already
    # exists; the checker config (dogfood:toml) runs last and writes
    # .dogfood.toml directly to the repo root via the bind-mount below
    # (the block is still printed to the logs as a fallback). The file is
    # committed, so it always exists at mount time — do not remove it.
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed && npm run db:fixtures && npm run dogfood:toml"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    volumes:
      - ./.dogfood.toml:/app/.dogfood.toml
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@postgres:5432/dogfood
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: dogfood
      S3_SECRET_KEY: dogfoodlocal
      S3_BUCKET: dogfood-assets
      S3_REGION: us-east-1
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      OFFLINE_MODE: "true"
      NODE_ENV: production
      DOGFOOD_BASE_URL: http://localhost:3000

  cli:
    build: .
    command: ["npm", "run", "cli"]
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@postgres:5432/dogfood
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: dogfood
      S3_SECRET_KEY: dogfoodlocal
      S3_BUCKET: dogfood-assets
      S3_REGION: us-east-1
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      OFFLINE_MODE: "true"
      NODE_ENV: production

  # Tier 4.5 webhook delivery worker: a long-running background process
  # (the first one in this compose file — everything else is `app` or a
  # one-shot command), reusing the app image rather than a second build.
  # It only ever calls URLs an organizer explicitly registered via
  # POST /api/events/:id/webhooks; with none registered (the default on a
  # fresh boot) it polls an empty outbox and makes zero outbound calls,
  # which is what keeps it OFFLINE_MODE-compatible without special-casing.
  # Nothing depends_on it — it's fire-and-forget, and the app container's
  # own startup must never wait on it.
  webhook-worker:
    build: .
    command: ["npm", "run", "worker:webhooks"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dogfood:dogfood@postgres:5432/dogfood
      OFFLINE_MODE: "true"
      NODE_ENV: production
      # Both empty/off by default. Registration (app) and delivery
      # (webhook-worker) each run assertSafeWebhookUrl independently in
      # their own process — these two vars must be set identically on both
      # services, or a host allowed at registration will still fail every
      # delivery attempt's send-time re-check.
      WEBHOOK_ALLOWED_HOSTS: ""
      # Off by default, same "explicit opt-in" shape as
      # ALLOW_DESTRUCTIVE_DB_TESTS — set to "true" only for local testing
      # against a listener elsewhere on the compose network.
      WEBHOOK_ALLOW_PRIVATE_HOSTS: "false"

volumes:
  pgdata:
  seaweeddata:
  keys:
